name: Security and quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKIP_ENV_VALIDATION: "1"
      AUDIT_LOG_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Audit full dependency tree
        id: audit-full
        run: npm run audit:full
      - name: Audit production dependency tree
        if: ${{ !cancelled() && steps.audit-full.outcome != 'skipped' }}
        run: npm run audit:production
      - run: npm run quality
      - name: Build Pages application in Vercel mode
        run: npm run build
        env:
          VERCEL: "1"
          VERCEL_ENV: preview
      - run: npm run verify:security-build
